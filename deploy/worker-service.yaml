services:
  media-worker:
    # APIの.env全体を渡さず、解析と容量計測に必要な値だけを共有する。
    environment:
      MDC_ENV: production
      MDC_DATABASE_URL_RW: "postgres://mado_worker:${MDC_WORKER_DB_PASSWORD:-worker-dev-only}@postgres:5432/dashboard"
      MDC_DATABASE_URL_RO: "postgres://mado_worker:${MDC_WORKER_DB_PASSWORD:-worker-dev-only}@postgres:5432/dashboard"
      # DBだけの初期化には不要。worker起動時はloadEnvで空の鍵を拒否する。
      MDC_STORAGE_SECRET_KEY: "${MDC_STORAGE_SECRET_KEY:-}"
      MDC_MEDIA_CONCURRENCY: "${MDC_MEDIA_CONCURRENCY:-3}"
      MDC_MEDIA_ANALYZE_TIMEOUT_SEC: "${MDC_MEDIA_ANALYZE_TIMEOUT_SEC:-300}"
      MDC_MEDIA_CACHE_MAX_AGE_DAYS: "${MDC_MEDIA_CACHE_MAX_AGE_DAYS:-30}"
      MDC_MEDIA_SPECTROGRAM_MAX_WIDTH: "${MDC_MEDIA_SPECTROGRAM_MAX_WIDTH:-4096}"
      MDC_MEDIA_WORKER_PORT: "${MDC_MEDIA_WORKER_PORT:-3100}"
    healthcheck:
      test: ["CMD", "node", "dist/scripts/healthcheck.js", "${MDC_MEDIA_WORKER_PORT:-3100}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s
