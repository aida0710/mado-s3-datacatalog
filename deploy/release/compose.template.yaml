name: mado

# api-internal・api-lineage・media-workerのhealthcheckの間隔。testだけをサービスごとに書く。
x-app-healthcheck: &app-healthcheck
  interval: 5s
  timeout: 3s
  retries: 3
  start_period: 60s

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}"
      POSTGRES_DB: dashboard
      MDC_DASHBOARD_DB_PASSWORD: "${MDC_DASHBOARD_DB_PASSWORD:?.env に MDC_DASHBOARD_DB_PASSWORD を設定してください}"
      MDC_LINEAGE_DB_PASSWORD: "${MDC_LINEAGE_DB_PASSWORD:?.env に MDC_LINEAGE_DB_PASSWORD を設定してください}"
      MDC_WORKER_DB_PASSWORD: "${MDC_WORKER_DB_PASSWORD:?.env に MDC_WORKER_DB_PASSWORD を設定してください}"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # 初回 init 中の一時サーバは Unix socket だけを listen する。socket 経由の pg_isready は
    # ロールの作成 (db/init) が終わる前に healthy を返すため、init 完了後に立つ本サーバだけが応える TCP で確認する。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-internal:
    image: "@@MADO_API_IMAGE@@"
    command: ["node", "dist/internal.js"]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "node", "dist/scripts/healthcheck.js", "3000"]
    env_file: [.env]
    environment:
      # 起動時に未適用の移行を当てる DB の管理者の接続。api-lineage と media-worker には渡さない。
      MDC_DATABASE_URL_MIGRATE: "postgres://postgres:${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}@postgres:5432/dashboard"
      MDC_ENV: production
      MDC_PORT: "3000"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-lineage:
    image: "@@MADO_API_IMAGE@@"
    command: ["node", "dist/lineage.js"]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "node", "dist/scripts/healthcheck.js", "3001"]
    environment:
      MDC_LINEAGE_PORT: "3001"
      MDC_DATABASE_URL_RW: "postgres://mado_lineage:${MDC_LINEAGE_DB_PASSWORD:?.env に MDC_LINEAGE_DB_PASSWORD を設定してください}@postgres:5432/dashboard"
      MDC_DATABASE_URL_RO: "postgres://mado_lineage:${MDC_LINEAGE_DB_PASSWORD:?.env に MDC_LINEAGE_DB_PASSWORD を設定してください}@postgres:5432/dashboard"
      MDC_DATASET_REGISTRY_URL: "${MDC_DATASET_REGISTRY_URL:?.env に MDC_DATASET_REGISTRY_URL を設定してください}"
      MDC_DATASET_REGISTRY_TOKEN: "${MDC_DATASET_REGISTRY_TOKEN:?.env に MDC_DATASET_REGISTRY_TOKEN を設定してください}"
      MDC_OPENLINEAGE_BODY_LIMIT_BYTES: "${MDC_OPENLINEAGE_BODY_LIMIT_BYTES:-2097152}"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      # api-internal が移行を当て終えて healthy になってから起動する。
      api-internal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  media-worker:
    extends:
      file: ./deploy/worker-service.yaml
      service: media-worker
    image: "@@MADO_WORKER_IMAGE@@"
    command: ["node", "dist/worker.js"]
    depends_on:
      # api-internal が移行を当て終えて healthy になってから起動する。
      api-internal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: "@@MADO_WEB_IMAGE@@"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      api-internal:
        condition: service_healthy
      api-lineage:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
