# compose.dev.yaml
# project name と container_name を mado-dev-* で揃える。compose.prod.yaml は
# mado-prod-* なので、両者は完全に独立した名前空間で走る (network/volume も自動で
# project name prefix される)。dev → prod のうっかり乗り換えで残留コンテナと
# 衝突する事故を防ぐため。
name: mado-dev

# api-internal・api-lineage・media-workerのhealthcheckの間隔。testだけをサービスごとに書く。
x-app-healthcheck: &app-healthcheck
  interval: 5s
  timeout: 3s
  retries: 3
  start_period: 60s

services:
  postgres:
    image: postgres:16-alpine
    container_name: mado-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # dev はゼロ設定で動くよう既定値あり。.env で上書き可能。
      # 注意: いずれも DB ボリュームの初回 init 時のみ反映 (既存DBは ALTER ROLE)。
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: dashboard
      MDC_DASHBOARD_DB_PASSWORD: "${MDC_DASHBOARD_DB_PASSWORD:-CHANGEME}"
      MDC_LINEAGE_DB_PASSWORD: "${MDC_LINEAGE_DB_PASSWORD:-lineage-dev-only}"
      MDC_WORKER_DB_PASSWORD: "${MDC_WORKER_DB_PASSWORD:-worker-dev-only}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # 初回 init 中の一時サーバは Unix socket だけを listen する。socket 経由の pg_isready は
    # ロールの作成 (db/init) が終わる前に healthy を返すため、init 完了後に立つ本サーバだけが応える TCP で確認する。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d dashboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-internal:
    build:
      context: ./api
      target: development
    container_name: mado-dev-api-internal
    command: ["npx", "tsx", "watch", "internal.ts"]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "npx", "tsx", "scripts/healthcheck.ts", "3000"]
    env_file:
      - .env
    environment:
      # 起動時に未適用の移行を当てる DB の管理者の接続。api-lineage と media-worker には渡さない。
      MDC_DATABASE_URL_MIGRATE: "postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/dashboard"
      MDC_PORT: 3000
      MDC_AUTH_MODE: "${MDC_AUTH_MODE:?Set MDC_AUTH_MODE to local, oidc, or hybrid}"
    volumes:
      - ./api:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  api-lineage:
    build:
      context: ./api
      target: development
    container_name: mado-dev-api-lineage
    command: ["npx", "tsx", "watch", "lineage.ts"]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "npx", "tsx", "scripts/healthcheck.ts", "3001"]
    environment:
      MDC_LINEAGE_PORT: 3001
      MDC_DATABASE_URL_RW: "postgres://mado_lineage:${MDC_LINEAGE_DB_PASSWORD:-lineage-dev-only}@postgres:5432/dashboard"
      MDC_DATABASE_URL_RO: "postgres://mado_lineage:${MDC_LINEAGE_DB_PASSWORD:-lineage-dev-only}@postgres:5432/dashboard"
      MDC_DATASET_REGISTRY_URL: "${MDC_DATASET_REGISTRY_URL:-http://host.docker.internal:8088}"
      MDC_DATASET_REGISTRY_TOKEN: "${MDC_DATASET_REGISTRY_TOKEN:-development-token-change-me}"
      MDC_OPENLINEAGE_BODY_LIMIT_BYTES: "${MDC_OPENLINEAGE_BODY_LIMIT_BYTES:-2097152}"
    volumes:
      - ./api:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      # api-internal が移行を当て終えて healthy になってから起動する。
      api-internal:
        condition: service_healthy
      postgres:
        condition: service_healthy

  media-worker:
    extends:
      file: ./deploy/worker-service.yaml
      service: media-worker
    build:
      context: ./api
      dockerfile: Dockerfile.worker
      target: development
    container_name: mado-dev-media-worker
    command: ["npx", "tsx", "watch", "worker.ts"]
    # 開発用のイメージには dist が無いので、deploy/worker-service.yaml の確認をソースで置き換える。
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "npx", "tsx", "scripts/healthcheck.ts", "${MDC_MEDIA_WORKER_PORT:-3100}"]
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      # api-internal が移行を当て終えて healthy になってから起動する。
      api-internal:
        condition: service_healthy
      postgres:
        condition: service_healthy

  front:
    build: ./front
    container_name: mado-dev-front
    # About のコミット表示。通常は下の .git マウント + コンテナ内 git で解決される。
    # env が設定されていれば (例: ./dev.sh) そちらを優先 (vite.config が env→git→'dev')。
    environment:
      MDC_GIT_COMMIT: "${MDC_GIT_COMMIT:-}"
      MDC_GIT_DATE: "${MDC_GIT_DATE:-}"
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - ./api/shared:/api/shared:ro
      - /app/node_modules
      # vite.config がコミット情報を読むため host の .git を read-only で渡す。
      - ./.git:/app/.git:ro
    depends_on:
      - api-internal
      - api-lineage

volumes:
  db_data:
